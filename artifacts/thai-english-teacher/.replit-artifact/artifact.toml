kind = "web"
previewPath = "/"
title = "ครูลภัส์ลดา - Summer Course 2026"
version = "1.0.0"
id = "artifacts/thai-english-teacher"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25237
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/thai-english-teacher run dev"

[services.env]
PORT = "25237"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/thai-english-teacher", "run", "build"]
publicDir = "artifacts/thai-english-teacher/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
